- name: Connect NetBird and Keep Alive
  env:
    NB_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
  shell: powershell
  run: |
    # Install and start NetBird
    winget install NetBird.NetBird
    netbird up --setup-key "$env:NB_SETUP_KEY"
    
    # Verify IP allocation
    $nbIp = (netbird status | Select-String -Pattern "NetBird IP: (\d+\.\d+\.\d+\.\d+)").Matches.Groups[1].Value
    Write-Host "NetBird IP: $nbIp"
    
    # FORCE Windows to keep the RDP session alive or the runner closes the pipe
    while ($true) {
        Start-Sleep -Seconds 60
    }
